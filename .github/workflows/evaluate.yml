# The correctness evaluation (Table 5.1), on every push to main and on demand.
name: evaluate
on:
  push: { branches: [main] }
  workflow_dispatch:
jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - run: just evaluate
      - uses: actions/upload-artifact@v4
        with: { name: correctness, path: out/ }
