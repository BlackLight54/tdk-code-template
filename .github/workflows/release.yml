# On a release tag: build the runtime image, publish it to the GitHub Container Registry under the
# same tag, so the Zenodo version and the image match; Zenodo archives the release itself.
name: release
on:
  release: { types: [published] }
permissions: { contents: read, packages: write }
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with: { context: ., push: true, tags: "ghcr.io/${{ github.repository }}:${{ github.event.release.tag_name }}" }
